<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Edu</title>
</head>

<body>
    <div>Sistema de Gestão Escolar</div>

    <div>Cadastro de alunos</div>

    <div>
        <form action="{{ url_for('cadastrar' ) }}" method="POST">
            <label for="nome">Nome do aluno:</label>
            <input type="text" id="nome" name="nome" required>

            <br><br>

            <label for="turma">Turma:</label>
            <input type="text" id="turma" name="turma" required>

            <br><br>

            <button type="submit">Cadastrar aluno</button>
        </form>
    </div>
    <div>
        <form action="{{ url_for('inicio') }}" method="GET">
            <label for="">Pesquisar alunos cadastrados:</label>

            <input type="text" id="busca" name="busca" value="{{busca}}" placeholder="Ex.: Ana ou 7º ano A">
            <button type="submit">Pesquisar</button>
            <a href="{{ url_for('inicio' ) }}">Limpar pesquisa</a>
            {% if alunos %}
            <ul>
                {% for aluno in alunos %}
                <li>{{ aluno.nome }} - Turma {{ aluno.turma }}</li>
                {% endfor %}
            </ul>
            {% elif busca %}
            <p>Nenhum aluno encontrado para "{{ busca }}".</p>
            {% else %}
            <p>Nenhum aluno cadastrado.</p>
            {% endif %}
        </form>
        <div>
            
        </div>
    </div>
</body>

</html>
