{% extends 'base.html' %}
{% block titulo %}Gestão Edu - Editar cadastro {{ aluno['nome_completo'] }}{% endblock %}

{% block conteudo %}
<div class="justify-content-between align-items-center flex-wrap">
    <div>
        <h2 class="fw-bold mb-1">Editar aluno</h2>
        <p class="text-secondary mb-0">
           Edite os dados de registro do aluno.
        </p>
    <div class="card-body p-4">
        <form action="{{ url_for('editar_aluno', id_aluno= aluno['id']) }}" method="POST">
            <div class="col-12 col-md-8">
                <label class="form-label" for="nome_completo">Nome do aluno:</label>
                <input class="form-control" type="text" id="nome_completo" name="nome_completo" value="{{ aluno['nome_completo'] }}" required>
            </div>

            <br><br>

            <div class="col-12 col-md-8">
                <label class="form-label" for="nome_responsavel">Nome do responsável:</label>
                <input class="form-control" type="text" id="nome_responsavel" name="nome_responsavel" value="{{ aluno['nome_responsavel'] }}" required>
            </div>

            <br><br>

            <div class="col-12 col-md-8">
                <label class="form-label" for="data_nascimento">Data de nascimento</label>
                <input class="form-control" type="date" id="data_nascimento" name="data_nascimento" value="{{ aluno['data_nascimento'] }}" required>
            </div>

            <br><br>

            <div class="col-12 col-md-8">
                <label class="form-label" for="cpf_aluno">Cpf do aluno:</label>
                <input class="form-control" type="text" id="cpf_aluno" name="cpf_aluno" value="{{ aluno['cpf_aluno'] }}" placeholder="000.000.000-00"
                    maxlength="14" autocomplete="off" oninput="mascaraCPF(this)" required>
            </div>

            <br><br>

            <div class="d-flex justify-content-end gap-2 flex-wrap">
                <a href="{{ url_for('inicio') }}" class="btn btn-light border">
                    Cancelar
                </a>
                <button class="btn btn-primary" type="submit">Editar aluno</button>
            </div>
        </form>
    </div>
</div>
<script>
    function mascaraCPF(input) {
        let valor = input.value.replace(/\D/g, "");

        if (valor.length > 3 && valor.length <= 6) {
            valor = valor.replace(/^(\d{3})(\d)/, "$1.$2");
        } else if (valor.length > 6 && valor.length <= 9) {
            valor = valor.replace(/^(\d{3})(\d{3})(\d)/, "$1.$2.$3");
        } else if (valor.length > 9) {
            valor = valor.replace(/^(\d{3})(\d{3})(\d{3})(\d)/, "$1.$2.$3-$4");
        }

        input.value = valor;
    }
</script>
{% endblock %}
